# Runtime env from OpenBao. Only a reference by key -- no secret value lives in this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bot-env
  namespace: services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bot-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: bot-env
