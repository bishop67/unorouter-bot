# Discord bot: SINGLE gateway connection -- never more than 1 replica (duplicate event
# handling otherwise). Recreate strategy keeps that true during rollouts.
apiVersion: v1
kind: Service
metadata:
  name: unorouter-bot
  namespace: services
spec:
  selector: { app: unorouter-bot }
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unorouter-bot
  namespace: services
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: unorouter-bot }
  template:
    metadata:
      labels: { app: unorouter-bot }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: bot
          # pinned by this repo's GHCR workflow (deploy job); ArgoCD rolls it out.
          # NEVER set this back to :latest -- a floating tag never changes the manifest, so
          # ArgoCD sees no diff and the deploy silently does not happen.
          image: ghcr.io/unorouter/unorouter-bot:52ee393879e12052b9da11132fef9c9ce139f0f5@sha256:7d0d26e17ff8e207da4c86eb36a3c32a752a380adc9e711f9ebbba9b3797c757
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 768Mi }
          env:
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          envFrom:
            - secretRef: { name: bot-env }
          ports:
            - containerPort: 4000
          # startupProbe gates liveness: on boot the bot sweeps every server-tag member
          # (~1/s, hundreds of them) before the health server binds :4000. Liveness at 30s
          # killed it mid-sweep, bun reported exit 1 with nothing logged, and the restart
          # replayed the same race -- one deploy = DeploymentNoReplicas at zero ready.
          startupProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 10
            failureThreshold: 30   # up to 5min for the boot sweep
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 20
