apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: bot-pg-store
  namespace: databases
  annotations:
    # deleting this breaks WAL archiving and PITR for a live cluster; never prune it
    argocd.argoproj.io/sync-options: Prune=false
spec:
  configuration:
    destinationPath: s3://unorouter-pg-backups/
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: bot-pg-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: bot-pg-s3
        key: ACCESS_SECRET_KEY
      region:
        name: bot-pg-s3
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  # boto3 >=1.36 checksum headers hang Ceph multipart uploads (see newapi-pg-store). bot is
  # small so it slipped through single-part, but set it here too for consistency + growth.
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bot-pg
  namespace: databases
  annotations:
    # see newapi-pg/cluster.yaml: overrides the app-level prune policy so an ownership move
    # can never delete the database.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  # see new-api/k8s/pg.yaml: CNPG owns the database backup, Velero must not file-copy a
  # running data directory
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: pgdata,scratch-data,shm
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-bookworm
  instances: 2
  storage:
    size: 10Gi
    storageClass: local-path

  # DR MODE: create-time-only recovery from S3 (see newapi-pg for the lineage mechanics).
  bootstrap:
    recovery:
      source: bot-pg-origin
  externalClusters:
    - name: bot-pg-origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: bot-pg-store
          serverName: bot-pg-v3 # RESTORE-FROM (current archive)

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bot-pg-store
        serverName: bot-pg-v4 # ARCHIVE-TO (current+1); MUST differ from restore-from
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  annotations:
    # without this the CR is prunable: an ownership move deleted it once, which reset
    # lastScheduleTime and dropped the Backup CR the freshness alert reads.
    argocd.argoproj.io/sync-options: Prune=false
  name: bot-pg-daily
  namespace: databases
spec:
  schedule: "0 15 3 * * *" # 03:15 UTC daily (offset from newapi-pg)
  backupOwnerReference: self
  cluster:
    name: bot-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
