# Hetzner Object Storage through the in-cluster s3-gateway, which encrypts (barman cannot).
# The bucket is Object Locked with a 30 day COMPLIANCE retention: no retentionPolicy here,
# the plugin must never delete; the bucket lifecycle expires objects instead.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: bot-pg-hz
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  configuration:
    destinationPath: s3://unorouter-backups/
    endpointURL: https://s3.unorouter.com
    s3Credentials:
      accessKeyId:
        name: s3gw
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3gw
        key: ACCESS_SECRET_KEY
      region:
        name: s3gw
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bot-pg
  namespace: databases
  annotations:
    # see newapi-pg/cluster.yaml: overrides the app-level prune policy so an ownership move
    # can never delete the database.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  # see new-api/k8s/pg.yaml: CNPG owns the database backup, Velero must not file-copy a
  # running data directory
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: pgdata,scratch-data,shm
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-bookworm
  instances: 2
  storage:
    size: 10Gi
    storageClass: local-path

  # DR MODE: create-time-only recovery from S3 (see newapi-pg for the lineage mechanics).
  bootstrap:
    recovery:
      source: bot-pg-origin
  externalClusters:
    - name: bot-pg-origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        enabled: true
        isWALArchiver: false
        parameters:
          barmanObjectName: bot-pg-hz
          serverName: bot-pg-v7 # RESTORE-FROM lineage: only read at bootstrap; on a DR create bump ARCHIVE-TO to v8 (the pair must differ)

  # The webhook defaults below (enabled, isWALArchiver) are written out because these are atomic lists: ArgoCD compares the
  # whole item and reports the app OutOfSync forever when the live object carries them.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: bot-pg-hz
        serverName: bot-pg-v7 # ARCHIVE-TO lineage: crypt gateway from 2026-09-09; v5 and v6 are SSE-C era, unreadable through it
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  annotations:
    # without this the CR is prunable: an ownership move deleted it once, which reset
    # lastScheduleTime and dropped the Backup CR the freshness alert reads.
    argocd.argoproj.io/sync-options: Prune=false
  name: bot-pg-daily
  namespace: databases
spec:
  schedule: "0 15 3 * * *" # 03:15 UTC daily (offset from newapi-pg)
  backupOwnerReference: self
  cluster:
    name: bot-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
